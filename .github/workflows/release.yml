name: .NET release

on:
  workflow_dispatch:
    inputs:
        release-version:
            description: "The version of the release"
            required: true
        is-prerelease:
            description: "Whether this is a prerelease version"
            required: true
            type: boolean
            default: false

permissions:
  contents: write

jobs:
  release:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish the tools
      # The command-line tools only: the other examples read files kept beside their source, so they are run from it.
      run: |
        mkdir -p binaries
        for project in LevelTool Examples/Paperify Examples/ReverseLevel; do
          name=$(basename $project)
          for target in win-x64:Windows linux-x64:Linux osx-x64:Mac osx-arm64:Mac-ARM; do
            runtime=${target%%:*}
            dotnet publish $project -c Release --self-contained true -r $runtime -o publish/$runtime/$name \
              /p:PublishSingleFile=true /p:PublishTrimmed=true /p:IncludeNativeLibrariesForSelfExtract=true
          done
          cp publish/win-x64/$name/$name.exe binaries/
          cp publish/linux-x64/$name/$name binaries/$name-Linux
          cp publish/osx-x64/$name/$name binaries/$name-Mac
          cp publish/osx-arm64/$name/$name binaries/$name-Mac-ARM
        done
    - name: Create a release
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.release-version }}
        draft: false
        prerelease: ${{ inputs.is-prerelease }}
        artifacts: "binaries/*"
